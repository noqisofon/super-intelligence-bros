[package]
name = "super-intelligence-bros"
version = "0.1.0"
edition = "2024"
default-run = "super-intelligence-bros"

[dependencies]
# ヘッドレス用: 描画・ウィンドウ系の feature は入れない
bevy = { version = "0.19", default-features = false }
png = "0.18.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std"] }

[features]
# 描画つきのビューア（sibros-view）用。ウィンドウ・GPU・入力まわりを足すので、通常のビルドには入れない
# Bevy の標準セット(2d/ui)から、Wayland・ゲームパッド(libudev)・クリップボードなどを外した最小構成。
# Linux では X11（Wayland 環境でも XWayland 経由）で動く。Windows / macOS はそのまま動く想定。
view = [
    "bevy/default_app",
    "bevy/std",
    "bevy/multi_threaded",
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/default_font",
    "bevy/2d_bevy_render",
    "bevy/ui_bevy_render",
    "bevy/png",
]

[[bin]]
name = "sibros-view"
path = "src/bin/sibros-view.rs"
required-features = ["view"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
